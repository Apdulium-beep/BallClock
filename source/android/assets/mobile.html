function build(){const app=$('#app');app.innerHTML='';$('#sectionTitle').textContent=GROUPS[tab].title;$('#sectionHint').textContent=GROUPS[tab].hint;UI.forEach(([title,items])=>{if(!GROUPS[tab].groups.includes(title))return;const s=document.createElement('section'),h=document.createElement('h2');h.textContent=title==='Часы'?'Цифры и цвет':title;s.append(h);if(title==='WiFi'){const note=document.createElement('p');note.className='note';note.textContent='Приложение автоматически запрашивает сеть BallClock при входе и освобождает её при выходе. Android может попросить подтверждение. Удерживайте кнопку Wi-Fi сверху для ручного выбора сети.';s.append(note)}items.forEach(it=>{if(!it.if||it.if(S))s.append(row(it))});app.append(s)});info()}
function layout(force){drawingLayout();const s=sigOf();if(force||s!==lastSig){const old=document.querySelector('.drawing-inspector'),top=old?old.scrollTop:0;lastSig=s;build();const panel=document.querySelector('.drawing-inspector');if(panel)panel.scrollTop=top||0;paintDrawing()}}
function info(){const all=UI.flatMap(g=>g[1]);document.querySelectorAll('b[data-i]').forEach(b=>{b.textContent=all[+b.dataset.i].f()});$('#saveStatus').textContent=Object.keys(pend).length||flushing?'Передаём изменения…':T.saved?'Настройки сохранены в часах. Можно отключаться.':'Настройки переданы; часы сохраняют их автоматически…'}
async function poll(){if(flushing||drawingBusy||drawingDraft||gradientBusy||gradientDraft||colorOpen||Object.keys(pend).length||['INPUT','SELECT'].includes(document.activeElement.tagName))return;try{const ch=adopt(await(await fetch('/api/state')).json());if(ch)layout(true);else layout();info()}catch(e){}}
async function scan(){const dl=$('#nets');for(let i=0;i<10;i++){const j=await(await fetch('/api/scan')).json();if(j.nets){dl.innerHTML='';j.nets.forEach(n=>{const o=document.createElement('option');o.value=n;dl.append(o)});$('#saveStatus').textContent='Найдено сетей: '+j.nets.length+'. Выберите сеть в поле SSID.';return}await new Promise(r=>setTimeout(r,1500))}}
GROUPS.forEach((group,i)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=group.name;b.setAttribute('aria-selected',String(i===tab));b.onclick=()=>{tab=i;colorOpen=null;customColorOpen=null;document.querySelectorAll('.tab').forEach((node,n)=>node.setAttribute('aria-selected',String(n===tab)));layout(true)};$('#tabs').append(b)});
// Preview uses the SAME WebView/Wi-Fi transport as settings. No JS/native bridge.
// tick() is called by Android; asynchronous fetches remain serial and stop when ticks stop.
const preview={seq:0,rgb:null,lastFrame:0,error:'',busy:false,next:0,failures:0,probeAt:0,controller:null,generation:0};
async function previewBody(r){if(!r.body||typeof r.body.getReader!=='function'){const text=await r.text();if(text.length>4096)throw Error('invalid_frame');return text}const reader=r.body.getReader(),parts=[];let length=0;while(true){const part=await reader.read();if(part.done)break;length+=part.value.length;if(length>4096){await reader.cancel();throw Error('invalid_frame')}parts.push(part.value)}const bytes=new Uint8Array(length);let at=0;for(const part of parts){bytes.set(part,at);at+=part.length}return new TextDecoder('utf-8').decode(bytes)}
async function previewJson(path){const controller=typeof AbortController==='function'?new AbortController():null;preview.controller=controller;const timeout=controller?setTimeout(()=>controller.abort(),1400):0;try{const options={cache:'no-store',redirect:'error'};if(controller)options.signal=controller.signal;const r=await fetch(path,options);if(!r.ok)throw Error('HTTP '+r.status);return JSON.parse(await previewBody(r))}finally{clearTimeout(timeout);if(preview.controller===controller)preview.controller=null}}
async function fetchPreview(){const generation=preview.generation,began=Date.now();preview.busy=true;try{const j=await previewJson('/api/v1/frame');if(generation!==preview.generation)return;if(j.device!=='ballclock'||j.api_version!==1||j.led_count!==128||typeof j.rgb!=='string'||!/^[a-fA-F0-9]{768}$/.test(j.rgb))throw Error('invalid_frame');preview.rgb=j.rgb;preview.lastFrame=Date.now();preview.seq++;preview.error='';preview.failures=0}catch(e){if(generation!==preview.generation)return;preview.failures++;preview.error=e.name==='AbortError'?'timeout':/^HTTP \d+$/.test(e.message)?e.message:e.message==='invalid_frame'?'invalid_frame':'network';if(Date.now()-preview.probeAt>2500){preview.probeAt=Date.now();try{const j=await previewJson('/api/state');if(generation===preview.generation&&j.s&&j.t&&j.device==='ballclock')lastControlContact=Date.now()}catch(ignored){}}}finally{if(generation===preview.generation){preview.busy=false;preview.next=Date.now()+(preview.failures?Math.min(2000,200*preview.failures):Math.max(15,50-(Date.now()-began)))}}}
window.BallClockPreview={tick(lastSeq){const now=Date.now();if(!preview.busy&&!flushing&&!drawingBusy&&!gradientBusy&&!Object.keys(pend).length&&now>=preview.next)fetchPreview();const age=preview.lastFrame?now-preview.lastFrame:-1,controls=lastControlContact&&now-lastControlContact<12000;const kind=age>=0&&age<3000?'live':controls?'preview_error':preview.failures?'offline':'connecting';return {seq:preview.seq,rgb:preview.seq!==lastSeq?preview.rgb:null,kind,error:preview.error,age,controls:!!controls}},stop(){preview.generation++;if(preview.controller)preview.controller.abort();preview.controller=null;preview.busy=false;preview.next=0}};
setInterval(()=>{if(!document.hidden&&GROUPS[tab].name==='Рисование')paintDrawing()},40);
(async()=>{try{adopt(await(await fetch('/api/state')).json());W.ssid=S.ssid;layout(true);if(!T.synced)await syncTime();setInterval(()=>{if(!document.hidden)poll()},5000)}catch(e){showError()}})();
