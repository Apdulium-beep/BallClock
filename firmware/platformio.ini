[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    fastled/FastLED@3.10.9
    adafruit/Adafruit NeoPixel@1.15.5
build_flags = -DFASTLED_INTERNAL -DFASTLED_ALLOW_INTERRUPTS=1 -DINTERRUPT_THRESHOLD=0 -DFASTLED_INTERRUPT_RETRY_COUNT=2
extra_scripts = pre:tools/gen_page.py
